server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;                      # VCF uploads allow 25 MB; the API enforces the real limits

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                          # assistant streaming
    proxy_read_timeout 120s;
  }
  location = /health { proxy_pass http://api:8000/health; }
  location = /readiness { proxy_pass http://api:8000/readiness; }
  # /metrics is deliberately not exposed publicly.

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
